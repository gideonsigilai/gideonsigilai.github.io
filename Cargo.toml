[package]
name = "portfolio"
version = "3.0.0"
edition = "2021"
rust-version = "1.80"
description = "Gideon Sigilai's portfolio: server-rendered site, admin, and content API in one binary"
license = "MIT"

[dependencies]
ammonia = "4"
argon2 = "0.5"
axum = { version = "0.8", features = ["http1", "json", "tokio", "query", "matched-path"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "macros"], default-features = false }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "set-header", "compression-gzip", "compression-br", "compression-deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
