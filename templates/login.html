<div class="wrap">
  <div class="login-card">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span> Private area</p>
    <h1>Sign in</h1>
    <p>Publishing and the conversation inbox live here. Credentials are checked server-side; the session cookie is httpOnly and never exposed to the browser.</p>
    {{#error}}<p class="alert alert--error" role="alert">{{error}}</p>{{/error}}
    <form class="form-grid" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <div class="field">
        <label for="admin-username">Username</label>
        <input id="admin-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--ink btn--block" type="submit">Sign in</button>
    </form>
  </div>
</div>
