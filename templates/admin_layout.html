<!doctype html>
<html lang="en" data-page="{{path}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f0b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="{{site_name}} — Dashboard">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/admin.css">
<script>(function(){try{var s=localStorage.getItem("theme");var t=s==="light"||s==="dark"?s:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");var d=document.documentElement;d.dataset.theme=t;d.style.colorScheme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="dark"?"#0d0f0b":"#f6f7f1")}catch(e){document.documentElement.dataset.theme="light"}})();</script>
{{head_extra}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="progress" id="progress" aria-hidden="true"></div>
<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <span class="brand-mark">{{initials}}</span>
      <span class="brand-name">Dashboard</span>
    </a>
    <nav class="nav" aria-label="Dashboard">
      {{#nav}}<a href="{{href}}"{{#active}} aria-current="page"{{/active}}>{{label}}</a>{{/nav}}
    </nav>
    <div class="header-tools">
      <a class="btn btn--ghost btn--sm" href="{{site_url}}">View site</a>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false"></button>
      <button type="button" class="icon-btn menu-btn" id="menu-open" aria-label="Open menu" aria-expanded="false" aria-haspopup="dialog"></button>
    </div>
  </div>
</header>

<dialog class="sheet" id="menu-sheet" aria-label="Dashboard menu">
  <div class="sheet-inner">
    <div class="sheet-top">
      <span class="eyebrow">Dashboard</span>
      <button type="button" class="icon-btn" id="menu-close" aria-label="Close menu"></button>
    </div>
    <nav class="sheet-nav" aria-label="Dashboard">
      {{#nav}}<a href="{{href}}"{{#active}} aria-current="page"{{/active}}>{{label}}<span>{{short}}</span></a>{{/nav}}
    </nav>
    <div class="sheet-foot">
      <a class="btn btn--lime btn--block" href="{{site_url}}">Open the portfolio</a>
      <p class="small muted" style="margin:0">{{site_name}} · {{location}}</p>
    </div>
  </div>
</dialog>

<main id="main">
{{body}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© {{year}} {{site_name}} · signed-in area</span>
      <nav class="footer-nav" aria-label="Footer">
        <a href="/">Inbox</a>
        <a href="/posts">Writing</a>
        <a href="/content">Portfolio</a>
        <a href="/analytics">Analytics</a>
        <a href="{{site_url}}">View site</a>
      </nav>
      <a href="#main">Back to top <span aria-hidden="true">↑</span></a>
    </div>
  </div>
</footer>

<script src="/static/core.js" defer></script>
</body>
</html>
