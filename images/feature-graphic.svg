<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
  <title id="title">MindPocket — save it now, find it later</title>
  <desc id="desc">Screenshots, voice notes, and ideas kept in one offline, searchable pocket.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17171C" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0CB59B"/>
      <stop offset="1" stop-color="#05695A"/>
    </linearGradient>
    <clipPath id="photoClip"><rect x="650" y="212" width="238" height="86" rx="14"/></clipPath>
  </defs>
  <rect width="1024" height="500" fill="#F6F6F4"/>
  <circle cx="932" cy="68" r="120" fill="#FECC30" opacity="0.32"/>
  <circle cx="969" cy="458" r="158" fill="#0CB59B" opacity="0.12"/>
  <path d="M0 423C125 380 216 449 329 415s151-13 247 15v70H0z" fill="#EFEEEA"/>

  <image href="../../assets/images/brand_mark.png" x="58" y="56" width="76" height="76" preserveAspectRatio="xMidYMid meet"/>
  <text x="154" y="111" fill="#17171C" font-family="Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2">MindPocket</text>
  <rect x="58" y="165" width="183" height="34" rx="17" fill="#DDF5EF"/>
  <circle cx="77" cy="182" r="5" fill="#05695A"/>
  <text x="92" y="188" fill="#05695A" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.3">OFFLINE BY DEFAULT</text>

  <text x="58" y="268" fill="#101014" font-family="Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.7">Save it now.</text>
  <text x="58" y="324" fill="#101014" font-family="Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.7">Find it later.</text>
  <text x="60" y="368" fill="#6E6C74" font-family="Arial, sans-serif" font-size="18" font-weight="400">Screenshots, voice notes and ideas—</text>
  <text x="60" y="395" fill="#6E6C74" font-family="Arial, sans-serif" font-size="18" font-weight="400">together in one searchable pocket.</text>
  <rect x="58" y="428" width="145" height="36" rx="18" fill="#17171C"/>
  <text x="82" y="452" fill="#F6F6F4" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">ON-DEVICE OCR</text>
  <rect x="214" y="428" width="151" height="36" rx="18" fill="#FECC30"/>
  <text x="237" y="452" fill="#221C00" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.8">VOICE + NOTES</text>

  <g transform="rotate(-7 769 255)" filter="url(#shadow)">
    <rect x="655" y="92" width="272" height="328" rx="26" fill="url(#teal)"/>
    <rect x="670" y="108" width="242" height="296" rx="18" fill="#FFFFFF"/>
    <rect x="691" y="129" width="92" height="22" rx="11" fill="#DDF5EF"/>
    <text x="704" y="144" fill="#05695A" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SAVED MEMORY</text>
    <text x="691" y="184" fill="#101014" font-family="Arial, sans-serif" font-size="22" font-weight="700">Weekend itinerary</text>
    <g clip-path="url(#photoClip)">
      <rect x="650" y="212" width="238" height="86" fill="#CDEBE6"/>
      <circle cx="834" cy="228" r="23" fill="#FECC30"/>
      <path d="M650 282l49-44 43 35 31-25 56 50H650z" fill="#0CB59B"/>
      <path d="M650 287l67-29 47 23 42-19 82 37H650z" fill="#05695A"/>
    </g>
    <text x="691" y="324" fill="#6E6C74" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TRAVEL PLANS</text>
    <path d="M691 344h197M691 366h165M691 388h183" stroke="#E4E2DD" stroke-width="2" stroke-linecap="round"/>
    <circle cx="874" cy="344" r="5" fill="#0CB59B"/>
  </g>

  <g transform="rotate(7 850 370)" filter="url(#shadow)">
    <rect x="805" y="332" width="172" height="104" rx="22" fill="#17171C"/>
    <circle cx="831" cy="384" r="18" fill="#FECC30"/>
