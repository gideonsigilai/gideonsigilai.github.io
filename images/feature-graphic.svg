      <rect x="877" y="376" width="4" height="16" rx="2"/>
      <rect x="886" y="360" width="4" height="48" rx="2"/>
      <rect x="895" y="371" width="4" height="26" rx="2"/>
      <rect x="904" y="365" width="4" height="38" rx="2"/>
      <rect x="913" y="374" width="4" height="20" rx="2"/>
      <rect x="922" y="368" width="4" height="32" rx="2"/>
      <rect x="931" y="376" width="4" height="16" rx="2"/>
    </g>
  </g>
</svg>
